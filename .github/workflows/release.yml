name: Release

# Fires whenever you push a tag like v1.0.0, v1.2.3, etc.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # needed so the workflow can create the release and upload assets

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry / build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # Package the binary (plus README/LICENSE) into a single archive per platform.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          BIN_NAME="twicbook-builder"
          DIST="twicbook-builder-${{ matrix.target }}"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$DIST/"
          cp README.md LICENSE "$DIST/" 2>/dev/null || true
          tar -czf "${DIST}.tar.gz" "$DIST"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $BinName = "twicbook-builder.exe"
          $Dist = "twicbook-builder-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $Dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$BinName" -Destination $Dist
          if (Test-Path README.md) { Copy-Item README.md -Destination $Dist }
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination $Dist }
          Compress-Archive -Path $Dist -DestinationPath "$Dist.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: twicbook-builder-${{ matrix.target }}
          path: |
            twicbook-builder-${{ matrix.target }}.tar.gz
            twicbook-builder-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true